<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --accent: #c0392b;
  --text: #111111;
  --text2: #333333;
  --text3: #888888;
  --border: #dce3ec;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
}
.brand {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px 12px;
  border-bottom: 1px solid var(--border);
}
.brand-icon {
  width: 38px; height: 38px;
  border-radius: 10px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-icon img { width: 100%; height: 100%; object-fit: contain; }
.brand-name {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 1.15rem; color: var(--text); line-height: 1.2;
}
.brand-sub {
  font-size: 0.7rem; font-weight: 600;
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--text3);
}
.lang-switcher {
  margin-left: auto; display: flex; gap: 4px; flex-shrink: 0;
}
.lang-btn {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--text3); background: none;
  border: 1.5px solid var(--border); border-radius: 6px;
  padding: 4px 9px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.lang-btn:hover { color: var(--text); border-color: var(--text3); }
.lang-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(192,57,43,0.06); }
.tabs-bar {
  display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 12px;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.01em;
  color: var(--text2); background: none; border: none;
  padding: 13px 16px; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.content {
  max-width: 760px; margin: 0 auto;
  padding: 36px 20px 80px;
}
.doc { display: none; }
.doc.active { display: block; }
.doc-eyebrow {
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.doc-title {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 2rem; color: var(--text); line-height: 1.2;
  text-wrap: balance; margin-bottom: 18px;
}
.meta-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 14px 18px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 5px 24px; margin-bottom: 28px;
}
.meta-row { font-size: 0.82rem; color: var(--text2); line-height: 1.5; }
.meta-row strong { font-weight: 600; color: var(--text); }
.sections { display: flex; flex-direction: column; gap: 10px; }
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.section-title {
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--accent); padding: 16px 20px 0; margin-bottom: 8px;
}
.section-body {
  font-size: 0.9rem; line-height: 1.8;
  color: var(--text2); padding: 0 20px 18px;
  white-space: pre-line;
}
.section-body strong { color: var(--text); font-weight: 600; }
.page-footer {
  text-align: center; margin-top: 48px;
  padding-top: 24px; border-top: 1px solid var(--border);
  color: var(--text3); font-size: 0.78rem;
}
@media (max-width: 480px) {
  .doc-title { font-size: 1.6rem; }
  .tab-btn { padding: 12px 13px; font-size: 0.78rem; }
  .brand { padding: 11px 16px 10px; }
  .content { padding: 24px 16px 60px; }
  .lang-btn { font-size: 0.68rem; padding: 4px 7px; }
}
</style>
</head>

const docIds = ['privacidad','terminos','contrato','aviso','eliminar'];
let currentLang = 'es';
let currentDoc = 'privacidad';

function renderPage(lang) {
  const data = CONTENT[lang];
  document.documentElement.lang = lang;
  document.getElementById('brand-sub').textContent = data.brandSub;

  // Tabs
  const tabsBar = document.getElementById('tabs-bar');
  tabsBar.innerHTML = data.tabs.map((label, i) => {
    const id = docIds[i];
    const active = id === currentDoc ? ' active' : '';
    const sel = id === currentDoc ? 'true' : 'false';
    return `<button class="tab-btn${active}" role="tab" aria-selected="${sel}" data-doc="${id}">${label}</button>`;
  }).join('');

  tabsBar.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentDoc = btn.dataset.doc;
      renderPage(currentLang);
      try { localStorage.setItem('be-tab', currentDoc); } catch(_){}
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  // Docs
  const main = document.getElementById('main-content');
  main.innerHTML = data.docs.map(doc => {
    const active = doc.id === currentDoc ? ' active' : '';
    const metaRows = doc.meta.map(([k,v]) => `<div class="meta-row"><strong>${k}:</strong> ${v}</div>`).join('');
    const sections = doc.sections.map(([title, body]) =>
      `<div class="section-card"><div class="section-title">${title}</div><div class="section-body">${body}</div></div>`
    ).join('');
    return `
<article id="${doc.id}" class="doc${active}" role="tabpanel">
  <div class="doc-eyebrow">${doc.eyebrow}</div>
  <h1 class="doc-title">${doc.title}</h1>
  <div class="meta-box">${metaRows}</div>
  <div class="sections">${sections}</div>
</article>`;
  }).join('');

  main.innerHTML += `<footer class="page-footer">ASSYST · assyst2021@ssthechofacil.com</footer>`;
}

// Lang buttons
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPage(currentLang);
    try { localStorage.setItem('be-lang', currentLang); } catch(_){}
  });
});

// Init
try {
  const savedLang = localStorage.getItem('be-lang');
  if (savedLang && CONTENT[savedLang]) {
    currentLang = savedLang;
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === currentLang);
    });
  }
  const savedTab = localStorage.getItem('be-tab');
  if (savedTab && docIds.includes(savedTab)) currentDoc = savedTab;
} catch(_){}

renderPage(currentLang);
</script>
